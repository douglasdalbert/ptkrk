<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111216">
    <title>Karaokê | Cantor</title>
    <link rel="stylesheet" href="/cantor/assets/style.css">
    <script type="module" src="/cantor/assets/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="wordmark"><span class="mark" aria-hidden="true">✳</span> KARAOKÊ <span class="wordmark-sub">/ CANTOR</span></div>
        <span id="connection" class="connection" role="status">Conectando</span>
      </header>

      <main class="scroll-content">
        <section id="entry" class="entry" aria-labelledby="entry-title">
          <p class="eyebrow">AO VIVO · REDE LOCAL</p>
          <h1 id="entry-title">Entre na festa.</h1>
          <form id="entry-form" class="form-stack" novalidate>
            <label for="singer-name">Seu nome</label>
            <input id="singer-name" name="name" maxlength="60" autocomplete="nickname" required placeholder="Como vamos te chamar?">
            <button class="primary" type="submit">Entrar <span aria-hidden="true">→</span></button>
          </form>
          <p id="entry-error" class="error" role="alert" hidden></p>
        </section>

        <section id="session" hidden>
          <div class="session-header">
            <div><p class="eyebrow">VOCÊ ESTÁ NA FESTA</p><h1 id="welcome"></h1></div>
            <button id="sign-out" class="text-button" type="button">Trocar pessoa</button>
          </div>

          <form id="request-form" class="request-form" novalidate>
            <label for="video-url">Peça uma música</label>
            <div class="request-row">
              <input id="video-url" type="text" name="video" required placeholder="Link ou código do YouTube" autocomplete="off" inputmode="url">
              <button class="primary" type="submit">Pedir <span aria-hidden="true">→</span></button>
            </div>
            <p id="request-message" class="message" role="status"></p>
          </form>

          <div class="scores" aria-label="Recordes">
            <div><span>SEU RECORDE</span><strong>—</strong></div>
            <div><span>RECORDE GERAL</span><strong>—</strong></div>
          </div>

          <section class="requests" aria-labelledby="requests-title">
            <div class="section-heading"><h2 id="requests-title">Pedidos</h2><span id="request-count">0</span></div>
            <p id="empty" class="empty">Ainda não há músicas pedidas.</p>
            <ol id="request-list" class="request-list"></ol>
          </section>
        </section>
      </main>
    </div>
    <footer id="action-footer" class="action-footer" hidden>
      <div class="footer-inner">
        <section id="skipping" class="skipping" role="status" hidden>
          <strong>Pulando música</strong><span id="skip-clock"></span>
        </section>
        <section id="invitation" class="invitation" aria-labelledby="invitation-title" hidden>
          <div class="invitation-details">
            <span class="eyebrow">SUA VEZ</span>
            <strong id="invitation-title">Hora de cantar</strong>
            <span id="invitation-song"></span>
          </div>
          <p id="invitation-message" role="status"></p>
          <button id="accept-button" class="footer-button accept-button" type="button">OK, vou cantar</button>
        </section>
        <div id="skip-action" class="skip-action" hidden>
          <p id="skip-message" role="status"></p>
          <button id="skip-button" class="footer-button skip-button" type="button">Pular música</button>
        </div>
      </div>
    </footer>
  </body>
</html>
