name: karaoke

services:
  app-singer:
    build: .
    container_name: app-singer
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KARAOKE_ALLOW_SKIP: ${KARAOKE_ALLOW_SKIP:-true}
      KARAOKE_LAN_IP: ${KARAOKE_LAN_IP:-}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${KARAOKE_PORT:-8000}:8000"
    volumes:
      - db_data:/data
      - media_data:/media
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/srv/app",
      ]
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./app
          target: /srv/app
          initial_sync: true
          ignore:
            - __pycache__/
        - action: sync
          path: ./app-singer
          target: /srv/app-singer
          initial_sync: true
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./requirements.txt
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  app-tv:
    container_name: app-tv
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KARAOKE_TV_LOCAL: "true"
      KARAOKE_LAN_IP: ${KARAOKE_LAN_IP:-}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - db_data:/data
      - media_data:/media
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/srv/app",
      ]
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./app
          target: /srv/app
          initial_sync: true
          ignore:
            - __pycache__/
        - action: sync
          path: ./app-singer
          target: /srv/app-singer
          initial_sync: true
        - action: sync
          path: ./app-tv
          target: /srv/app-tv
          initial_sync: true
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./requirements.txt

  worker:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - db_data:/data
      - media_data:/media
    command: ["watchfiles", "python -m app.worker", "/srv/app"]
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./app
          target: /srv/app
          initial_sync: true
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./requirements.txt

volumes:
  db_data:
  media_data:
