name: karaoke

services:
  app:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KARAOKE_ALLOW_SKIP: ${KARAOKE_ALLOW_SKIP:-true}
      KARAOKE_LAN_IP: ${KARAOKE_LAN_IP:-}
    ports:
      - "${KARAOKE_PORT:-8000}:8000"
    volumes:
      - db_data:/data
      - media_data:/media
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  tv:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KARAOKE_TV_LOCAL: "true"
      KARAOKE_LAN_IP: ${KARAOKE_LAN_IP:-}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - db_data:/data
      - media_data:/media
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - db_data:/data
      - media_data:/media
    restart: unless-stopped

volumes:
  db_data:
  media_data:
