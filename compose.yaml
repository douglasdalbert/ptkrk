name: karaoke

services:
  app-singer:
    build: .
    container_name: app-singer
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KARAOKE_ALLOW_SKIP: ${KARAOKE_ALLOW_SKIP:-true}
      KARAOKE_SEARCH_LIMIT: ${KARAOKE_SEARCH_LIMIT:-10}
      KARAOKE_SCORE_MAX: ${KARAOKE_SCORE_MAX:-1000}
      KARAOKE_SCORE_BLOCK_MS: ${KARAOKE_SCORE_BLOCK_MS:-1000}
      KARAOKE_CAPTION_HISTORY_MS: ${KARAOKE_CAPTION_HISTORY_MS:-60000}
      KARAOKE_CAPTION_REPEAT_PERCENT: ${KARAOKE_CAPTION_REPEAT_PERCENT:-70}
      KARAOKE_SCORE_TOLERANCE_MS: ${KARAOKE_SCORE_TOLERANCE_MS:-100}
      KARAOKE_SCORE_OFF_CUE_PENALTY: ${KARAOKE_SCORE_OFF_CUE_PENALTY:-1}
      KARAOKE_SCORE_OFF_CUE_REARM_MS: ${KARAOKE_SCORE_OFF_CUE_REARM_MS:-500}
      KARAOKE_SCORE_RMS_THRESHOLD: ${KARAOKE_SCORE_RMS_THRESHOLD:-0.04}
      KARAOKE_SCORE_SILENCE_MS: ${KARAOKE_SCORE_SILENCE_MS:-300}
      KARAOKE_BOOST_FILL_PERCENT: ${KARAOKE_BOOST_FILL_PERCENT:-25}
      KARAOKE_BOOST_MULTIPLIER: ${KARAOKE_BOOST_MULTIPLIER:-1.5}
      KARAOKE_BOOST_DURATION_MS: ${KARAOKE_BOOST_DURATION_MS:-15000}
      KARAOKE_BOOST_LOUDNESS_PERCENT: ${KARAOKE_BOOST_LOUDNESS_PERCENT:-40}
      KARAOKE_LAN_IP: ${KARAOKE_LAN_IP:-}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${KARAOKE_PORT:-8000}:8000"
    volumes:
      - db_data:/data
      - media_data:/media
      - ./.certs:/certs:ro
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--ssl-certfile",
        "/certs/singer.pem",
        "--ssl-keyfile",
        "/certs/singer-key.pem",
        "--reload",
        "--reload-dir",
        "/srv/app",
      ]
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./app
          target: /srv/app
          initial_sync: true
          ignore:
            - __pycache__/
        - action: sync
          path: ./app-singer
          target: /srv/app-singer
          initial_sync: true
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./requirements.txt
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8000/health', context=ssl._create_unverified_context(), timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  app-tv:
    container_name: app-tv
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KARAOKE_TV_LOCAL: "true"
      KARAOKE_LAN_IP: ${KARAOKE_LAN_IP:-}
      KARAOKE_SCORE_MAX: ${KARAOKE_SCORE_MAX:-1000}
      KARAOKE_SCORE_BLOCK_MS: ${KARAOKE_SCORE_BLOCK_MS:-1000}
      KARAOKE_SCORE_LANES: ${KARAOKE_SCORE_LANES:-3}
      KARAOKE_CAPTION_HISTORY_MS: ${KARAOKE_CAPTION_HISTORY_MS:-60000}
      KARAOKE_CAPTION_REPEAT_PERCENT: ${KARAOKE_CAPTION_REPEAT_PERCENT:-70}
      KARAOKE_SCORE_TOLERANCE_MS: ${KARAOKE_SCORE_TOLERANCE_MS:-100}
      KARAOKE_SCORE_OFF_CUE_PENALTY: ${KARAOKE_SCORE_OFF_CUE_PENALTY:-1}
      KARAOKE_SCORE_OFF_CUE_REARM_MS: ${KARAOKE_SCORE_OFF_CUE_REARM_MS:-500}
      KARAOKE_SCORE_RMS_THRESHOLD: ${KARAOKE_SCORE_RMS_THRESHOLD:-0.04}
      KARAOKE_BOOST_FILL_PERCENT: ${KARAOKE_BOOST_FILL_PERCENT:-25}
      KARAOKE_BOOST_MULTIPLIER: ${KARAOKE_BOOST_MULTIPLIER:-1.5}
      KARAOKE_BOOST_DURATION_MS: ${KARAOKE_BOOST_DURATION_MS:-15000}
      KARAOKE_BOOST_LOUDNESS_PERCENT: ${KARAOKE_BOOST_LOUDNESS_PERCENT:-40}
      KARAOKE_STAR_LOW_PERCENT: ${KARAOKE_STAR_LOW_PERCENT:-25}
      KARAOKE_STAR_HIGH_PERCENT: ${KARAOKE_STAR_HIGH_PERCENT:-75}
      KARAOKE_STAR_NICE_PERCENT: ${KARAOKE_STAR_NICE_PERCENT:-91}
      KARAOKE_STAR_CLOSE_MS: ${KARAOKE_STAR_CLOSE_MS:-30000}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - db_data:/data
      - media_data:/media
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/srv/app",
      ]
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./app
          target: /srv/app
          initial_sync: true
          ignore:
            - __pycache__/
        - action: sync
          path: ./app-singer
          target: /srv/app-singer
          initial_sync: true
        - action: sync
          path: ./app-tv
          target: /srv/app-tv
          initial_sync: true
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./requirements.txt

  worker:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      KARAOKE_SCORE_MAX: ${KARAOKE_SCORE_MAX:-1000}
      KARAOKE_SCORE_BLOCK_MS: ${KARAOKE_SCORE_BLOCK_MS:-1000}
      KARAOKE_CAPTION_HISTORY_MS: ${KARAOKE_CAPTION_HISTORY_MS:-60000}
      KARAOKE_CAPTION_REPEAT_PERCENT: ${KARAOKE_CAPTION_REPEAT_PERCENT:-70}
      KARAOKE_SCORE_TOLERANCE_MS: ${KARAOKE_SCORE_TOLERANCE_MS:-100}
      KARAOKE_SCORE_OFF_CUE_PENALTY: ${KARAOKE_SCORE_OFF_CUE_PENALTY:-1}
      KARAOKE_SCORE_OFF_CUE_REARM_MS: ${KARAOKE_SCORE_OFF_CUE_REARM_MS:-500}
      KARAOKE_SCORE_RMS_THRESHOLD: ${KARAOKE_SCORE_RMS_THRESHOLD:-0.04}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - db_data:/data
      - media_data:/media
    command: ["watchfiles", "python -m app.worker", "/srv/app"]
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./app
          target: /srv/app
          initial_sync: true
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./requirements.txt

  separator:
    build:
      context: .
      dockerfile: Dockerfile.separator
    depends_on:
      app-singer:
        condition: service_healthy
    environment:
      KARAOKE_DB_PATH: /data/karaoke.sqlite3
      KARAOKE_MEDIA_PATH: /media
      KARAOKE_MODEL_PATH: /models
      KARAOKE_SEPARATOR_CPU_THREADS: ${KARAOKE_SEPARATOR_CPU_THREADS:-8}
      OMP_NUM_THREADS: ${KARAOKE_SEPARATOR_CPU_THREADS:-8}
      MKL_NUM_THREADS: ${KARAOKE_SEPARATOR_CPU_THREADS:-8}
      OPENBLAS_NUM_THREADS: ${KARAOKE_SEPARATOR_CPU_THREADS:-8}
      NUMEXPR_NUM_THREADS: ${KARAOKE_SEPARATOR_CPU_THREADS:-8}
    volumes:
      - db_data:/data
      - media_data:/media
      - separator_models:/models
    cpus: ${KARAOKE_SEPARATOR_CPU_LIMIT:-8.4}
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./Dockerfile.separator
        - action: rebuild
          path: ./app/separation.py
        - action: rebuild
          path: ./app/storage.py
        - action: rebuild
          path: ./app/media.py

volumes:
  db_data:
  media_data:
  separator_models:
