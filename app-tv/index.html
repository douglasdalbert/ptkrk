<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Karaokê | TV</title>
  <link rel="stylesheet" href="/tv/assets/style.css">
  <script type="module" src="/tv/assets/app.js"></script>
</head>
<body>
  <main id="stage">
    <section id="show">
      <div class="screen">
        <video id="video" playsinline preload="metadata"></video>
        <div id="boost-frame" class="boost-frame" aria-hidden="true"><span class="boost-frame-art"></span></div>
        <div id="video-overlay" hidden>
          <div id="boost-stars" class="boost-stars" aria-hidden="true"></div>
          <div class="track" id="track" aria-live="off" hidden><span id="vocal-marker" class="vocal-marker" aria-hidden="true"></span><div id="lyric-text"></div></div>
          <button id="play" type="button" hidden>Reproduzir</button>
        </div>
        <div id="intermission">
          <div class="feature">
            <img id="next-preview" alt="" hidden>
            <div class="feature-shade"></div>
            <div class="feature-text"><p id="next-status">AGUARDANDO MÚSICAS</p><h1 id="next-title">A festa começa aqui.</h1><p id="next-singer"></p></div>
          </div>
        </div>
        <span id="connect-status" class="connect-status" role="status" data-state="connecting" title="Conectando" tabindex="0"><span class="sr-only">Conectando</span></span>
        <div id="skip-notice" class="skip-notice" hidden>Pulando música <span id="skip-clock"></span></div>
        <div id="error" class="error" role="alert"></div>
      </div>
      <div id="boost-bar" class="boost-bar" role="progressbar" aria-label="Barra de energia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-state="charging">
        <span class="boost-fill"></span>
        <span id="boost-label" class="boost-label"></span>
      </div>
      <footer class="tv-footer">
        <section class="queue" aria-labelledby="queue-title">
          <h2 id="queue-title">Próximas músicas</h2>
          <div class="upcoming" id="upcoming"></div>
        </section>
        <section class="actions" aria-label="Ações da TV">
          <button id="noise-action" type="button" title="Ajustar ruído: - ou _ diminui, + ou = aumenta"><span id="noise-label" aria-live="polite">Ruído --%</span> <span class="keycaps"><kbd>−</kbd><kbd>+</kbd></span></button>
          <button id="play-action" type="button" title="Reproduzir o vídeo (Espaço)" disabled>Reproduzir <kbd>Espaço</kbd></button>
          <button id="move-track-action" type="button" title="Mover blocos (setas para cima e para baixo)">Mover blocos <span class="keycaps"><kbd>↑</kbd><kbd>↓</kbd></span></button>
          <button id="color-action" type="button" title="Alternar as cores dos blocos (C)">Alterne as cores dos blocos <kbd>C</kbd></button>
          <button id="reset-action" type="button" title="Iniciar nova festa (Ctrl+Alt+N)">Nova festa <kbd>Ctrl+Alt+N</kbd></button>
        </section>
        <aside class="join" id="join">
          <h2>Entre na festa</h2>
          <img id="qr" alt="QR para entrar na festa" hidden>
          <span id="join-url">Conectando ao Wi-Fi</span>
        </aside>
      </footer>
    </section>
    <section id="score-panel" class="score-panel" aria-label="Pontuação final" hidden>
      <video id="score-backdrop" class="score-backdrop" playsinline loop muted aria-hidden="true"></video>
      <div id="score-star" class="score-star">
        <span class="score-star-hole"></span>
        <span class="score-star-fill"><span class="score-star-level"></span></span>
        <svg class="score-star-outline" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,3 62,36 97,37 69,58 80,93 50,73 20,93 31,58 3,37 38,36"/></svg>
        <strong id="score-value" class="score-value" aria-live="polite">0</strong>
      </div>
      <div id="score-streamers" class="score-streamers" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
