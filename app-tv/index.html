<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Karaokê | TV</title>
  <link rel="stylesheet" href="/tv/assets/style.css">
  <script type="module" src="/tv/assets/app.js"></script>
</head>
<body>
  <main id="stage">
    <section id="show">
      <video id="video" playsinline preload="metadata"></video>
      <div id="video-overlay" hidden>
        <div class="track" id="track"><span>♫</span></div>
        <button id="play" type="button" hidden>Reproduzir</button>
      </div>
      <div id="intermission">
        <div class="heading"><span>AO VIVO / KARAOKÊ</span><span id="connect-status">Conectando</span></div>
        <div class="feature">
          <img id="next-preview" alt="" hidden>
          <div class="feature-shade"></div>
          <div class="feature-text"><p id="next-status">AGUARDANDO MÚSICAS</p><h1 id="next-title">A festa começa aqui.</h1><p id="next-singer"></p></div>
        </div>
        <div class="upcoming" id="upcoming"></div>
      </div>
      <aside class="join" id="join"><img id="qr" alt="QR para entrar na festa" hidden><div><strong>ENTRE NA FESTA</strong><span id="join-url">Conectando ao Wi-Fi</span></div></aside>
      <div id="skip-notice" class="skip-notice" hidden>Pulando música <span id="skip-clock"></span></div>
      <div id="error" class="error" role="status"></div>
    </section>
  </main>
</body>
</html>
